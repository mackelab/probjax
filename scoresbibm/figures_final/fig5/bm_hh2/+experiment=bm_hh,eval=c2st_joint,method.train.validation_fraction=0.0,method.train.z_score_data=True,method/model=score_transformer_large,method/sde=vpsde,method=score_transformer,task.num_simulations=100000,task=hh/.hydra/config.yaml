name: bm_hh2
seed: 0
save_model: true
save_summary: true
method:
  model:
    token_dim: 40
    condition_token_dim: 10
    condition_token_init_scale: 0.01
    condition_token_init_mean: 0.0
    condition_mode: concat
    time_embedding_dim: 128
    num_heads: 4
    num_layers: 8
    attn_size: 10
    widening_factor: 4
    num_hidden_layers: 1
    skip_connection_attn: true
    skip_connection_mlp: true
    layer_norm: true
  train:
    condition_mask_fn:
      name: structured_random
      p_joint: 0.2
      p_posterior: 0.2
      p_likelihood: 0.2
      p_rnd1: 0.2
      p_rnd2: 0.2
      rnd1_prob: 0.3
      rnd2_prob: 0.7
    edge_mask_fn:
      name: none
    max_number_steps: 100000
    min_number_steps: 5000
    total_number_steps_scaling: 3
    training_batch_size: 1000
    learning_rate: 0.001
    min_learning_rate: 1.0e-06
    clip_max_norm: 10.0
    validation_fraction: 0.0
    val_repeat: 5
    val_every: 50
    stop_early_count: 5
    z_score_data: true
  sde:
    name: vpsde
    beta_max: 10.0
    beta_min: 0.01
    T_max: 1.0
    T_min: 1.0e-05
  posterior:
    sampling_method: sde
    num_steps: 500
    method: euler_maruyama
  name: score_transformer
  backend: jax
  device: gpu
task:
  name: hh
  num_simulations: 100000
eval:
  metric:
    c2st_joint:
      n_folds: 5
      metric: accuracy
      classifier: rf
      condition_mask_fn: joint
sweeper:
  name: null
  objective: null
