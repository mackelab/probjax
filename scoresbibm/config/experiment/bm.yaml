# @package _global_
name: bm_vpsde

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      method: score_transformer,score_transformer_posterior,score_transformer_min_graphical
      task: gaussian_linear,gaussian_mixture,two_moons,slcp
      method/model: score_transformer_small
      task.num_simulations: 1000,10000,100000
  run:
    dir: results/${name}
  sweep:
    dir: results/${name}
    subdir: ${hydra.job.override_dirname}


defaults:
  - _self_
  - override /partition: gpu
