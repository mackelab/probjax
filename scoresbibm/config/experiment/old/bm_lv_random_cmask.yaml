# @package _global_
name: main_benchmark_lv_random_cmask

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      method: score_transformer,score_transformer_undirected,score_transformer_directed
      method/model: score_transformer_small
      method/sde: vesde,vpsde
      method/train/condition_mask_fn: random
      method.train.validation_fraction: 0.
      eval: c2st
      task: lotka_volterra
      task.num_simulations: 1000,10000,100000

  run:
    dir: results/${name}
  sweep:
    dir: results/${name}
    subdir: ${hydra.job.override_dirname}


defaults:
  - _self_
  - override /partition: gpu
