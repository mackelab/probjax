name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
        cuda: [false, true]
        exclude:
          - python-version: "3.11"
            cuda: true  # Exclude CUDA tests for Python 3.11 as it's not fully supported yet

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install CUDA dependencies
      if: matrix.cuda
      run: |
        sudo apt-get update
        sudo apt-get install -y cuda-toolkit-12-0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ "${{ matrix.cuda }}" = "true" ]; then
          pip install -e ".[dev,cuda12]"
        else
          pip install -e ".[dev]"
        fi

    - name: Run linting
      run: |
        ruff check .
        ruff format --check .

    - name: Run tests
      run: |
        pytest tests/ -v --cov=probjax --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: true
