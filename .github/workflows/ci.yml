name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Restore testmon database
      uses: actions/cache/restore@v4
      with:
        path: .testmondata
        key: testmon-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.sha }}
        restore-keys: |
          testmon-${{ runner.os }}-py${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run affected tests
      run: |
        pytest tests/ -q -n auto --testmon --benchmark-disable

    - name: Save testmon database
      # Only save from main: the repo is public and PRs must not be able
      # to poison the cache restored by other runs.
      if: github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: .testmondata
        key: testmon-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.sha }}

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run full test suite with coverage
      # No --testmon here: coverage must see the full suite, otherwise
      # Codecov project/patch gates compare partial numbers.
      run: |
        pytest tests/ -q -n auto --benchmark-disable --cov=probjax --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      # codecov-action v7 renamed the `file` input to `files`.
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        fail_ci_if_error: true
        use_oidc: true
        verbose: true
