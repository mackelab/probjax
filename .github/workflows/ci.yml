name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Restore testmon database
      uses: actions/cache/restore@v4
      with:
        path: .testmondata
        key: testmon-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.sha }}
        restore-keys: |
          testmon-${{ runner.os }}-py${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run affected tests
      run: |
        pytest tests/ -v --testmon -n auto

    - name: Run full test suite with coverage
      if: github.event_name == 'push'
      run: |
        pytest tests/ -v -n auto --cov=probjax --cov-report=xml

    - name: Save testmon database
      # Only save from main: the repo is public and PRs must not be able
      # to poison the cache restored by other runs.
      if: github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: .testmondata
        key: testmon-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.sha }}

    - name: Upload coverage to Codecov
      # Coverage is only generated on push runs; PR runs have no report to
      # upload. codecov-action v7 also renamed the `file` input to `files`.
      if: hashFiles('coverage.xml') != ''
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        fail_ci_if_error: true
