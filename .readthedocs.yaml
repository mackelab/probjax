# Zensical is not one of Read the Docs' two native builders, so the site is
# produced through the generic build.commands hook. Two consequences: PDF and
# ePub are unavailable (Zensical emits HTML only), and the output has to be
# moved into $READTHEDOCS_OUTPUT/html by hand, since `zensical build` takes its
# destination from `site_dir` in zensical.toml rather than a flag.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - pip install -r docs/requirements.txt
    - pip install -e .
    - zensical build --strict
    - mkdir -p "$READTHEDOCS_OUTPUT" && mv site "$READTHEDOCS_OUTPUT/html"
