codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "60...90"
  status:
    project:
      default:
        # Fail if overall coverage drops vs base commit; allow 1% noise.
        target: auto
        threshold: 1%
        informational: false
    patch:
      default:
        # New/changed lines must be well tested; allow small exceptions.
        target: 70%
        threshold: 1%
        informational: false

parsers:
  gcov:
    branch_detection:
      conditional: true
      loop: true
      method: false
      macro: false

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false

github_checks:
  annotations: true

ignore:
  - "tests/**/*"
  - "benchmarks/**/*"
  - "examples/**/*"
  - "docs/**/*"
  - "site/**/*"
