
[flake8]
max-line-length = 88
exclude = docs, build, dist, .ipynb_checkpoints

[isort]
line_length = 88
include_trailing_comma=True
force_grid_wrap=0
use_parentheses=True
skip_glob=.ipynb_checkpoints
known_first_party=sbi,tests
known_third_party=matplotlib,numpy,pandas,pytest,pyknos,scipy,setuptools,six,sklearn,torch,tqdm,typeguard,yaml, jax
multi_line_output=3

[tool:pytest]
plt_filename_drop =
    ^--


[options.packages.find]
where = settorch
exclude =
    tests


   